name: Verify TV clock and leaderboard build

on:
  push:
    branches:
      - codex/google-compliance-btf-refresh
    paths:
      - .github/workflows/verify-tv-clock-leaderboard-build.yml

permissions:
  contents: write

jobs:
  compile-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: codex/google-compliance-btf-refresh
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Compile Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/verify-tv-clock-leaderboard-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary TV clock build workflow"
          git push origin HEAD:codex/google-compliance-btf-refresh
