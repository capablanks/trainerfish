name: Apply Chess TV semi-gate and PGN handoff

on:
  push:
    branches:
      - codex/google-compliance-btf-refresh
    paths:
      - .github/workflows/apply-chess-tv-semigate-and-pgn-handoff.yml

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/google-compliance-btf-refresh
          fetch-depth: 0
      - name: Apply source update
        run: python3 tools/apply_chess_tv_semigate_and_pgn_handoff.py
      - name: Commit source changes and remove one-time files
        shell: bash
        run: |
          git config user.name "TrainerFish Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/tonorbe/trainerfish/MainActivity.kt
          git add app/src/main/java/com/tonorbe/trainerfish/TrainerFishLanding.kt
          git add app/src/main/java/com/tonorbe/trainerfish/LichessTvScreen.kt
          git add app/src/main/java/com/tonorbe/trainerfish/playgames/TrainerFishPlayGamesController.kt
          git rm tools/apply_chess_tv_semigate_and_pgn_handoff.py
          git rm .github/workflows/apply-chess-tv-semigate-and-pgn-handoff.yml
          git commit -m "Add Chess TV support prompt and PGN handoff"
          git push origin HEAD:codex/google-compliance-btf-refresh
