name: Apply Chess TV result and PGN fix

on:
  push:
    branches:
      - codex/google-compliance-btf-refresh
    paths:
      - .github/workflows/apply-chess-tv-result-pgn-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/google-compliance-btf-refresh
          fetch-depth: 0
      - name: Apply source patch
        run: python3 tools/apply_chess_tv_result_pgn_fix.py
      - name: Commit patched sources and remove one-time files
        shell: bash
        run: |
          git config user.name "TrainerFish Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/tonorbe/trainerfish/LichessTvClient.kt
          git add app/src/main/java/com/tonorbe/trainerfish/LichessTvScreen.kt
          git rm tools/apply_chess_tv_result_pgn_fix.py
          git rm .github/workflows/apply-chess-tv-result-pgn-fix.yml
          git commit -m "Fix Chess TV PGN review, results, and export"
          git push origin HEAD:codex/google-compliance-btf-refresh
