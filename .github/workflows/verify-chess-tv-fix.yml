name: Verify Chess TV fix

on:
  push:
    branches:
      - codex/google-compliance-btf-refresh
    paths:
      - .github/workflows/verify-chess-tv-fix.yml
      - app/src/main/java/com/tonorbe/trainerfish/LichessTvClient.kt
      - app/src/main/java/com/tonorbe/trainerfish/LichessTvScreen.kt

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/google-compliance-btf-refresh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile debug Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace
